[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefing-diario-noticias"
version = "0.1.0"
description = "Pipeline deterministico do briefing executivo diario (fundacao tecnica - Fase 1A)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.1,<7",
    # Base IANA de fusos para zoneinfo quando o sistema nao a fornece.
    "tzdata>=2026.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
